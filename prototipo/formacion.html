<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#100D25">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>Talento NFQ · Formación</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Sora:wght@300;400;600&display=swap" rel="stylesheet">
<style>
/* Layout: barra de marca NFQ arriba (marino, logo, 4 secciones, Datos), una sección a la vez, fichas y formularios en paneles laterales o modales. */
:root{
  --bg:#F3F3F6; --surface:#FFFFFF; --surface-2:#F7F7FA; --ink:#100D25; --ink-2:#5D5F6A; --line:#DFDFE7;
  --brand:#217BEE; --brand-text:#1764CC; --brand-ink:#FFFFFF; --brand-soft:#E7F0FD;
  --navy:#100D25; --navy-2:#1D1940; --on-navy:#FFFFFF; --on-navy-2:#B9B8CC;
  --warn:#B4471F; --warn-soft:#FDEEE7; --crit:#B8284D; --crit-soft:#FBE7ED; --ok:#1C7A4E; --ok-soft:#E2F3EA; --info:#1764CC; --info-soft:#E7F0FD;
  --grad:linear-gradient(90deg,#EC683E 0%,#D13B5F 45%,#217BEE 100%);
  --display:"Sora",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:8px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B0A17; --surface:#14122A; --surface-2:#1B1934; --ink:#ECECF4; --ink-2:#A6A7B6; --line:#2D2A4A;
    --brand:#5C9DF2; --brand-text:#7DB1F6; --brand-ink:#0B0A17; --brand-soft:#16294A;
    --navy:#0E0C21; --navy-2:#1D1A3C; --on-navy:#FFFFFF; --on-navy-2:#A9A8C0;
    --warn:#F2A07E; --warn-soft:#3A2016; --crit:#F08AA4; --crit-soft:#3B1726; --ok:#72D3A2; --ok-soft:#12301F; --info:#7DB1F6; --info-soft:#16294A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B0A17; --surface:#14122A; --surface-2:#1B1934; --ink:#ECECF4; --ink-2:#A6A7B6; --line:#2D2A4A;
  --brand:#5C9DF2; --brand-text:#7DB1F6; --brand-ink:#0B0A17; --brand-soft:#16294A;
  --navy:#0E0C21; --navy-2:#1D1A3C; --on-navy:#FFFFFF; --on-navy-2:#A9A8C0;
  --warn:#F2A07E; --warn-soft:#3A2016; --crit:#F08AA4; --crit-soft:#3B1726; --ok:#72D3A2; --ok-soft:#12301F; --info:#7DB1F6; --info-soft:#16294A;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;letter-spacing:-0.005em}
button,select,input,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
a{color:var(--brand-text)}
h1,h2,h3,p{margin:0}
h1,h2{font-family:var(--display);font-weight:400;letter-spacing:-0.02em;text-wrap:balance}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.num,.tab-n,.score,.kpi b{font-variant-numeric:tabular-nums}

/* barra de marca */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--navy);color:var(--on-navy)}
.bar::after{content:"";display:block;height:3px;background:var(--grad)}
.bar-in{max-width:1360px;margin:0 auto;padding:0 16px;display:flex;align-items:center;gap:8px 28px;min-height:60px;flex-wrap:wrap}
.brandmark{display:flex;align-items:center;gap:12px;color:var(--on-navy);text-decoration:none;flex:none}
.brandmark .logo{height:26px;width:auto;display:block}
.brandmark span{font-family:var(--display);font-weight:300;font-size:17px;color:var(--on-navy-2);padding-left:12px;border-left:1px solid var(--navy-2)}
.tabs{display:flex;gap:2px;align-self:stretch;overflow-x:auto;flex:1 1 auto;min-width:0}
.tab{border:0;background:none;color:var(--on-navy-2);padding:0 14px;font-weight:500;white-space:nowrap;position:relative;display:flex;align-items:center;gap:7px}
.tab:hover{color:var(--on-navy)}
.tab[aria-selected="true"]{color:var(--on-navy)}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:10px;right:10px;bottom:0;height:3px;background:var(--on-navy);border-radius:2px 2px 0 0}
.tab[disabled]{opacity:.4;cursor:default}
.tab-n{font-size:12px;padding:1px 7px;border-radius:999px;background:var(--navy-2);color:var(--on-navy-2)}
.datos{display:flex;align-items:center;gap:8px;border:1px solid var(--navy-2);background:none;color:var(--on-navy-2);border-radius:999px;padding:5px 12px 5px 10px;font-size:13px;flex:none}
.datos:hover{color:var(--on-navy);border-color:var(--on-navy-2)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--on-navy-2);flex:none}
.dot.on{background:#3FCF8E} .dot.busy{background:#EC683E} .dot.err{background:#F08AA4}

main{max-width:1360px;margin:0 auto;padding:24px 16px 96px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px;margin-bottom:18px}
.head h1{font-size:28px;line-height:1.15}
.head p{color:var(--ink-2);margin-top:4px}
.head .actions{display:flex;gap:8px;flex-wrap:wrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.note{font-size:13px;color:var(--ink-2)}
.empty{padding:28px 16px;color:var(--ink-2);text-align:center}
.banner-soft{margin-bottom:14px;padding:10px 14px;border-radius:var(--r);background:var(--warn-soft);color:var(--warn);font-size:14px}

/* controles */
.btn{border:1px solid var(--brand);background:var(--brand);color:var(--brand-ink);border-radius:999px;padding:7px 16px;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:none;color:var(--brand-text)}
.btn.quiet{background:var(--surface);color:var(--ink);border-color:var(--line);font-weight:500}
.btn.sm{padding:4px 12px;font-size:13px}
.btn.big{padding:11px 22px;font-size:15px}
.btn[disabled]{opacity:.5;cursor:default;filter:none}
.linkbtn{border:0;background:none;color:var(--brand-text);padding:0;font-size:13px;font-weight:500;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.field,.sel{padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);min-width:0}
.field{width:100%}
.sel{padding-right:10px;max-width:220px}
.list-head .row2 .sel{flex:1 1 130px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.toolbar .field{flex:1 1 240px;width:auto}
.toolbar .more-f{display:contents}
.toolbar .more-f[hidden]{display:none!important}
.check{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2)}
.check input{accent-color:var(--brand);width:16px;height:16px}

/* chips, pills, tags */
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-size:13px;white-space:nowrap}
.chip.hit{background:var(--brand-soft);border-color:transparent}
.chip.half{background:none;border-style:dashed;border-color:var(--brand)}
.chip.cv::after{content:"CV";font-size:10px;font-weight:700;color:var(--brand-text)}
.req{display:inline-flex;align-items:stretch;border-radius:999px;background:var(--brand-soft);font-size:13px;overflow:hidden}
.req.must{background:var(--brand);color:var(--brand-ink)}
.req button{border:0;background:none;color:inherit;padding:4px 6px 4px 11px;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.req button + button{padding:4px 10px 4px 4px;font-size:15px;line-height:1;opacity:.75}
.req i{font-style:normal;font-size:11px;font-weight:700}
select.add{padding:4px 10px;border:1px dashed var(--line);border-radius:999px;background:var(--surface);font-size:13px;max-width:220px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:2px 9px;border-radius:999px;white-space:nowrap;background:var(--surface-2);color:var(--ink-2)}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.crit{background:var(--crit-soft);color:var(--crit)} .pill.info{background:var(--info-soft);color:var(--info)}
.prio{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-2);white-space:nowrap}
.prio::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--line)}
.prio.alta::before{background:var(--crit)} .prio.media::before{background:#EC683E} .prio.baja::before{background:var(--ink-2)}
.tag{font-size:12px;padding:1px 8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
.tag.go{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.tag.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.tag.stop{background:var(--crit-soft);border-color:transparent;color:var(--crit)}
.tag.cvt{background:var(--brand-soft);border-color:transparent;color:var(--brand-text);font-weight:600}
.tagx{display:inline-flex;align-items:center;gap:2px;font-size:12px;padding:1px 4px 1px 9px;border-radius:999px;background:var(--brand-soft)}
.tagx button{border:0;background:none;padding:0 4px;font-size:14px;line-height:1;color:var(--ink-2)}
.tagin{padding:3px 10px;border:1px dashed var(--line);border-radius:999px;background:var(--surface);font-size:12px;width:150px}
.sub{font-size:13px;color:var(--ink-2);margin-top:2px}
.byline{font-size:12px;color:var(--ink-2)}
.name{border:0;background:none;padding:0;font-weight:600;font-size:15px;text-align:left;color:var(--ink);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.name:hover{text-decoration-color:var(--brand)}

/* necesidades: lista + detalle */
.split{display:grid;grid-template-columns:360px minmax(0,1fr);gap:16px;align-items:start}
.list{position:sticky;top:88px;max-height:calc(100vh - 108px);display:flex;flex-direction:column;overflow:hidden}
.list-head{padding:12px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.list-head .row2{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.list-body{overflow:auto}
.item{display:grid;gap:3px;width:100%;text-align:left;border:0;background:none;padding:12px 14px;border-bottom:1px solid var(--line);border-left:3px solid transparent}
.item:hover{background:var(--surface-2)}
.item[aria-current="true"]{background:var(--brand-soft);border-left-color:var(--brand)}
.item-top{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--ink-2)}
.item-title{font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item-foot{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:12px;color:var(--ink-2)}
.item-foot b{color:var(--ink)}
.detail{padding:22px 24px 12px;min-width:0;scroll-margin-top:90px}
.detail-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px 16px;align-items:flex-start}
.detail-head h2{font-size:24px;line-height:1.2}
.eyebrow{font-size:13px;color:var(--ink-2);margin-bottom:4px}
.facts{display:flex;flex-wrap:wrap;gap:4px 18px;color:var(--ink-2);font-size:13px;margin-top:6px}
details.full{margin-top:8px;font-size:13px;color:var(--ink-2)}
details.full summary{cursor:pointer;color:var(--brand-text)}
.meta{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;margin-top:14px;padding:10px 12px;background:var(--surface-2);border-radius:var(--r);font-size:13px}
.meta label{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2)}
.meta select,.meta input{padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
.meta .byline{margin-left:auto}
.subtabs{display:flex;gap:4px;margin-top:18px;border-bottom:1px solid var(--line);overflow-x:auto}
.subtab{border:0;background:none;padding:9px 12px;color:var(--ink-2);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.subtab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brand)}
.subtab b{font-weight:600;margin-left:4px;font-variant-numeric:tabular-nums}
.sect{padding-top:16px}
.sect h3{font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:8px}
.hrow{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px;margin-bottom:8px}
.hrow h3{margin:0}
.controls{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;font-size:13px;margin-top:12px}
.controls label{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2)}
.controls select{padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
.ai{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-top:12px;padding:10px 14px;border-radius:var(--r);background:var(--surface-2);font-size:13px}
.ai .note{flex:1 1 220px}
.internal{margin-top:12px;font-size:13px;color:var(--ink-2)}

.rank{list-style:none;margin:10px 0 0;padding:0}
.row{display:grid;grid-template-columns:20px 54px minmax(0,1fr) auto;gap:4px 14px;padding:14px 0;border-top:1px solid var(--line);align-items:start}
.row.sel{background:linear-gradient(90deg,var(--brand-soft),transparent 70%)}
.row input[type=checkbox]{margin:8px 0 0;width:16px;height:16px;accent-color:var(--brand)}
.score{font-family:var(--display);font-size:28px;font-weight:300;line-height:1;text-align:right;letter-spacing:-0.03em}
.score small{display:block;font-family:var(--body);font-size:11px;color:var(--ink-2);margin-top:4px;letter-spacing:0}
.who{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline}
.strip{display:flex;gap:3px;margin:8px 0 6px}
.seg{width:24px;height:6px;border-radius:3px;background:var(--line)}
.seg.hit{background:var(--brand)}
.seg.half{background:repeating-linear-gradient(135deg,var(--brand) 0 2px,transparent 2px 4px);outline:1px solid var(--brand);outline-offset:-1px}
.seg.must{box-shadow:0 0 0 1.5px var(--surface),0 0 0 2.5px var(--ink)}
.why{font-size:13px}
.why .k{color:var(--ink-2)}
.more{margin:14px 0 6px;display:flex;gap:10px;align-items:center}

/* tablas */
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-size:12px;font-weight:600;color:var(--ink-2);padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:hover td{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:0}
td.num{white-space:nowrap}
td select{padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.count{padding:10px 14px;font-size:13px;color:var(--ink-2);border-bottom:1px solid var(--line)}
.foot-note{padding:10px 14px;font-size:13px;color:var(--ink-2);border-top:1px solid var(--line)}
.chanchip{display:inline-flex;gap:5px;align-items:center;font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);white-space:nowrap;text-decoration:none;color:var(--ink)}
.chanchip.on{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.chanchip.pause{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.bar-h{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--line);width:120px;margin-top:6px}
.bar-h i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--ink-2)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:0}

/* funnel */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(236px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px;align-items:start}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);min-width:0;display:flex;flex-direction:column;max-height:calc(100vh - 250px)}
.col-head{display:flex;justify-content:space-between;align-items:baseline;padding:12px 14px 10px}
.col-head b{font-size:14px;font-weight:600}
.col-head span{font-family:var(--display);font-size:22px;font-weight:300}
.col-list{overflow:auto;padding:0 8px 8px;display:grid;gap:8px;align-content:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px;display:grid;gap:5px;font-size:13px}
.card.stale{box-shadow:inset 3px 0 0 #EC683E}
.card-foot{display:flex;gap:6px;align-items:center;justify-content:space-between;margin-top:2px}
.mv{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:28px;height:24px;color:var(--ink-2);line-height:1}
.mv:hover{color:var(--brand-text);border-color:var(--brand)}
.closed{margin-top:14px;padding:12px 14px}
.closed summary{cursor:pointer;font-size:14px;color:var(--ink-2)}

/* conexión y datos */
.connect{max-width:720px;margin:40px auto;padding:36px}
.connect h1{font-size:34px;line-height:1.12;font-weight:300}
.connect .lead{font-size:16px;color:var(--ink-2);margin-top:12px;max-width:60ch}
.steps{list-style:none;margin:22px 0;padding:0;counter-reset:s}
.steps li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:4px 12px;padding:12px 0;border-top:1px solid var(--line);align-items:start}
.steps li::before{counter-increment:s;content:counter(s);width:24px;height:24px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--ink-2)}
.steps li.done::before{content:"✓";background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.steps li.busy::before{border-color:#EC683E;color:#EC683E}
.steps li.err::before{content:"!";background:var(--crit-soft);border-color:transparent;color:var(--crit)}
.errbox{margin-top:8px;padding:10px 12px;border-radius:var(--r);background:var(--crit-soft);color:var(--crit);font-size:14px}
.addsrc{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.addsrc .field{flex:1 1 260px}
.iconbtn{border:1px solid transparent;background:none;border-radius:999px;padding:3px 10px;color:var(--ink-2);font-size:13px}
.iconbtn:hover{border-color:var(--line);color:var(--crit)}
.gatebar{display:flex;height:30px;border-radius:6px;overflow:hidden;margin:12px 0 6px}
.gatebar div{display:flex;align-items:center;padding:0 10px;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden}
.g-ok{background:var(--brand);color:var(--brand-ink)} .g-no{background:var(--surface-2);color:var(--ink-2)} .g-exp{background:var(--warn-soft);color:var(--warn)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:12px}
.kpi{background:var(--surface);padding:12px 14px}
.kpi b{display:block;font-family:var(--display);font-weight:300;font-size:26px;line-height:1.1}
.kpi span{font-size:12px;color:var(--ink-2)}

/* paneles */
dialog{border:0;padding:0;color:var(--ink);background:var(--surface)}
dialog::backdrop{background:rgba(16,13,37,.5)}
#drawer,#datos{margin:0 0 0 auto;height:100vh;max-height:100vh;width:min(580px,100vw);max-width:100vw;border-left:1px solid var(--line)}
#compare,#editor{width:min(800px,calc(100vw - 32px));max-width:none;max-height:calc(100vh - 48px);border-radius:12px;border:1px solid var(--line)}
#compare{width:min(1040px,calc(100vw - 32px))}
.dw{padding:22px 24px 40px}
.dw-top{display:flex;justify-content:space-between;gap:12px;align-items:start}
.dw h2{font-size:24px;line-height:1.15}
.dw-nav{display:flex;gap:6px;flex:none}
.x{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px}
.x[disabled]{opacity:.4}
.lead-line{margin-top:6px;color:var(--ink-2)}
.dsec{margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
.dsec h3{font-family:var(--display);font-weight:400;font-size:16px;margin-bottom:10px;letter-spacing:-0.01em}
.banner{margin-top:12px;padding:10px 12px;border-radius:var(--r);background:var(--crit-soft);color:var(--crit);font-size:14px}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.dl{display:grid;grid-template-columns:130px minmax(0,1fr);gap:6px 12px;font-size:14px;margin:0}
.dl dt{color:var(--ink-2)} .dl dd{margin:0;overflow-wrap:anywhere}
.quote{font-size:14px;padding:8px 12px;border-left:3px solid var(--line);color:var(--ink-2);overflow-wrap:anywhere;margin-top:10px}
.exp{list-style:none;margin:0;padding:0;font-size:14px}
.exp li{padding:7px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px}
.exp li:first-child{border-top:0}
.exp span{color:var(--ink-2);white-space:nowrap}
.proc{padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);display:grid;gap:8px;margin-bottom:8px}
.proc .meta{margin-top:0;padding:0;background:none}
textarea.note-in{width:100%;min-height:52px;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-size:14px;resize:vertical}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px;margin-top:18px}
.form .full{grid-column:1/-1}
.form label{display:grid;gap:5px;font-size:13px;color:var(--ink-2)}
.form input,.form select,.form textarea{padding:9px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);font-size:14px;width:100%}
.form textarea{min-height:90px;resize:vertical;line-height:1.45}
.form textarea.tall{min-height:240px}
.chan{display:grid;grid-template-columns:minmax(150px,auto) 140px minmax(0,1fr);gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.chan select,.chan input{padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);font-size:13px;width:100%}
.formerr{color:var(--crit);font-size:13px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.cmp{overflow-x:auto}
.cmp table{min-width:640px}
.cmp tbody th{font-weight:600;color:var(--ink-2);font-size:12px;white-space:normal;width:150px;background:none}
.mark{font-weight:600} .mark.y{color:var(--ok)} .mark.h{color:var(--warn)} .mark.n{color:var(--ink-2);font-weight:400}
.cmpbar{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:6;display:flex;gap:12px;align-items:center;padding:8px 8px 8px 18px;background:var(--navy);color:var(--on-navy);border-radius:999px;font-size:14px;box-shadow:0 8px 28px rgba(16,13,37,.3);max-width:calc(100vw - 32px)}
.cmpbar .btn{background:var(--on-navy);color:var(--navy);border-color:var(--on-navy)}
.cmpbar .linkbtn{color:var(--on-navy-2)}
.toast{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:7;display:flex;gap:14px;align-items:center;padding:11px 16px;background:var(--navy);color:var(--on-navy);border-radius:var(--r);font-size:14px;box-shadow:0 8px 28px rgba(16,13,37,.3);max-width:calc(100vw - 32px)}
.toast .linkbtn{color:#7FB4F8}
.toast[hidden]{display:none}

@media (max-width:960px){
  .split{grid-template-columns:1fr}
  .list{position:static;max-height:340px}
  .row{grid-template-columns:20px 44px minmax(0,1fr)}
  .row .act{grid-column:3}
  .score{font-size:22px}
  .detail{padding:18px 16px}
  .head h1{font-size:24px}
  .dl{grid-template-columns:100px minmax(0,1fr)}
  .form{grid-template-columns:1fr}
  .chan{grid-template-columns:1fr 1fr} .chan input{grid-column:1/-1}
  .board{grid-auto-columns:minmax(230px,82vw)}
  .col{max-height:none}
  .brandmark span{display:none}
  .tabs{order:3;flex-basis:100%;min-height:44px}
  .connect{padding:24px;margin:16px auto}
  .connect h1{font-size:26px}
  .meta .byline{margin-left:0}
  .cmpbar{left:16px;right:16px;transform:none}
  .toast{bottom:calc(76px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion:no-preference){ #drawer[open],#datos[open]{animation:slide .18s ease-out} @keyframes slide{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}} }

/* acceso de solo lectura */
.ro [data-act=newneed],.ro [data-act=newoffer],.ro [data-act=addfun],.ro [data-act=mv],.ro [data-act=addfunsel],.ro [data-act=editneed],.ro .btn[data-act=editoffer],.ro [data-act=adopt],.ro [data-act=suggest],.ro [data-act=resetskills],.ro #addSkill,.ro .req button+button,.ro #tagin,.ro #addfun-need{display:none!important}
.ro select[data-act],.ro input[data-act]:not([type=checkbox]),.ro textarea[data-act]{pointer-events:none;opacity:.65}
.ro .req button{pointer-events:none}
code{font-size:13px;background:var(--surface-2);padding:1px 5px;border-radius:4px}

/* formación */
.connect{max-width:560px;margin:48px auto;padding:36px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:grid;gap:14px}
.connect h1{font-size:30px} .connect p{color:var(--ink-2)}
.prog{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin-top:10px;border:1px solid var(--line)}
.prog i{display:block;height:100%;background:var(--grad)}
.capa{margin-top:14px}
.capa-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.capa-h h2{font-size:18px}
.mrow{display:grid;grid-template-columns:88px minmax(0,1fr) 64px auto;gap:4px 14px;padding:12px 16px;border-top:1px solid var(--line);align-items:start}
.mrow:first-of-type{border-top:0}
.mrow-id{padding-top:2px}
.mname{font-weight:500;color:var(--ink);text-decoration:none}
.mname:hover{text-decoration:underline}
.mmeta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:4px;font-size:13px}
.mrow-h{text-align:right;padding-top:2px;color:var(--ink-2)}
.mrow-a{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.prev-g{padding:10px 16px;border-top:1px solid var(--line)}
.prev-g h3{font-size:14px;font-weight:600;margin-bottom:8px} .prev-g .chip{margin:0 6px 6px 0;font-size:12px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-2);font-weight:600;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th.num,.tbl td.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl tr:last-child td{border-bottom:0}
.tbl.matrix td,.tbl.matrix th{text-align:center;padding:8px 6px} .tbl.matrix td:first-child,.tbl.matrix th:first-child{text-align:left}
.tbl.matrix td.on{background:var(--brand-soft);font-weight:600;color:var(--brand-text)}
.bd{display:inline-block;min-width:20px;text-align:center;font-size:11px;font-weight:600;padding:1px 4px;border-radius:4px;margin-right:2px;border:1px solid var(--line);color:var(--ink-2)}
.bd.obl{background:var(--ink);color:var(--surface);border-color:var(--ink)} .bd.rec{background:var(--surface-2)} .bd.ele{border-style:dashed} .bd.na{opacity:.3}
.owners{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1px;background:var(--line)}
.owner{background:var(--surface);padding:12px 16px;display:grid;gap:6px;font-size:13px}
.owner.warn b{color:var(--warn)}
.owner .chip{font-size:12px;padding:1px 8px}
.check{display:inline-flex;gap:6px;align-items:center}
.check input{accent-color:var(--brand)}
.dw ul{margin:6px 0 0;padding-left:18px}
.toolbar .field{flex:0 1 auto} .toolbar .field select,.toolbar .field input{margin-left:6px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
.week-panel{margin-top:14px}
.week{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:var(--line)}
.day{background:var(--surface);padding:10px 12px;display:grid;gap:6px;align-content:start;min-width:0}
.day-h{display:grid;gap:2px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.ditem{display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:6px;align-items:start;font-size:13px;color:var(--ink);text-decoration:none;padding:4px 0}
.ditem:hover .dname{text-decoration:underline}
.ditem .st{width:12px;height:12px;border-radius:50%;border:2px solid var(--ink-2);margin-top:3px}
.ditem.st-en_curso .st{border-color:var(--brand);background:linear-gradient(90deg,var(--brand) 50%,transparent 50%)}
.ditem.st-completado .st,.ditem.st-convalidado .st,.ditem.st-exento .st{border-color:var(--ok);background:var(--ok)}
.ditem.st-completado .dname,.ditem.st-convalidado .dname,.ditem.st-exento .dname{color:var(--ink-2)}
.ditem .dh{color:var(--ink-2);font-size:12px;white-space:nowrap}
@media (max-width:900px){ .week{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:520px){ .week{grid-template-columns:1fr} }
.demo-banner{background:var(--warn-soft);color:var(--warn);text-align:center;font-size:13px;padding:6px 16px}
@media (max-width:760px){ .mrow{grid-template-columns:1fr auto} .mrow-id{grid-column:1/-1} .mrow-a{grid-column:1/-1;justify-content:flex-start} .form{grid-template-columns:1fr} }
</style>
</head>
